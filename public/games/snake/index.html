<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Snake Classic Unblocked</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: #090d16;
      color: #f8fafc;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 12px;
    }
    .wrapper {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 12px;
      max-width: 440px;
      width: 100%;
    }
    .header {
      width: 100%;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    h1 {
      font-size: 28px;
      font-weight: 800;
      color: #10b981;
      letter-spacing: 1px;
    }
    .stats {
      display: flex;
      gap: 10px;
    }
    .badge {
      background: #1e293b;
      border: 1px solid #334155;
      padding: 4px 10px;
      border-radius: 6px;
      font-size: 13px;
      font-weight: 700;
    }
    .badge span { color: #10b981; }
    .canvas-box {
      position: relative;
      background: #020617;
      border: 2px solid #10b981;
      border-radius: 12px;
      overflow: hidden;
      box-shadow: 0 0 20px rgba(16, 185, 129, 0.2);
    }
    canvas {
      display: block;
      background: #020617;
    }
    .overlay {
      position: absolute;
      top: 0; left: 0; right: 0; bottom: 0;
      background: rgba(2, 6, 23, 0.85);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 12px;
      backdrop-filter: blur(2px);
    }
    .overlay.hidden { display: none; }
    .overlay h2 { font-size: 28px; color: #ef4444; font-weight: 800; }
    .btn {
      background: #10b981;
      color: #020617;
      border: none;
      padding: 8px 18px;
      font-size: 14px;
      font-weight: 700;
      border-radius: 6px;
      cursor: pointer;
    }
    .btn:hover { background: #34d399; }
    .mobile-controls {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 6px;
      width: 160px;
      margin-top: 6px;
    }
    .d-btn {
      background: #1e293b;
      border: 1px solid #334155;
      color: #f8fafc;
      font-size: 18px;
      font-weight: bold;
      padding: 10px;
      border-radius: 8px;
      cursor: pointer;
    }
    .d-btn:active { background: #10b981; color: #020617; }
    .sub { font-size: 12px; color: #64748b; }
  </style>
</head>
<body>
  <div class="wrapper">
    <div class="header">
      <h1>SNAKE</h1>
      <div class="stats">
        <div class="badge">Score: <span id="score">0</span></div>
        <div class="badge">High: <span id="high">0</span></div>
      </div>
    </div>
    <div class="canvas-box">
      <canvas id="game" width="400" height="400"></canvas>
      <div class="overlay hidden" id="overlay">
        <h2 id="ov-title">Game Over</h2>
        <p id="ov-sub" class="sub">Press Space or Start to play</p>
        <button class="btn" id="start-btn">Play Again</button>
      </div>
    </div>
    <span class="sub">Controls: <b>Arrow Keys</b> or <b>WASD</b> • <b>Space</b> to Pause</span>
    <div class="mobile-controls">
      <div></div>
      <button class="d-btn" id="btn-u">↑</button>
      <div></div>
      <button class="d-btn" id="btn-l">←</button>
      <button class="d-btn" id="btn-d">↓</button>
      <button class="d-btn" id="btn-r">→</button>
    </div>
  </div>

  <script>
    const canvas = document.getElementById('game');
    const ctx = canvas.getContext('2d');
    const scoreEl = document.getElementById('score');
    const highEl = document.getElementById('high');
    const overlay = document.getElementById('overlay');
    const ovTitle = document.getElementById('ov-title');
    const startBtn = document.getElementById('start-btn');

    const GRID = 20;
    const COUNT = canvas.width / GRID;

    let snake = [{ x: 10, y: 10 }, { x: 9, y: 10 }, { x: 8, y: 10 }];
    let dir = { x: 1, y: 0 };
    let nextDir = { x: 1, y: 0 };
    let food = { x: 15, y: 10 };
    let score = 0;
    let high = parseInt(localStorage.getItem('ignite_snake_high') || '0', 10);
    highEl.textContent = high;
    let gameLoop = null;
    let isPaused = false;
    let isDead = false;

    function playTone(freq, duration) {
      try {
        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
        gain.gain.setValueAtTime(0.1, audioCtx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + duration);
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        osc.start();
        osc.stop(audioCtx.currentTime + duration);
      } catch(e) {}
    }

    function placeFood() {
      let valid = false;
      while (!valid) {
        food = {
          x: Math.floor(Math.random() * COUNT),
          y: Math.floor(Math.random() * COUNT)
        };
        valid = !snake.some(segment => segment.x === food.x && segment.y === food.y);
      }
    }

    function update() {
      if (isPaused || isDead) return;
      dir = nextDir;
      const head = { x: snake[0].x + dir.x, y: snake[0].y + dir.y };

      // Wall collision
      if (head.x < 0 || head.x >= COUNT || head.y < 0 || head.y >= COUNT) {
        gameOver();
        return;
      }
      // Self collision
      if (snake.some(seg => seg.x === head.x && seg.y === head.y)) {
        gameOver();
        return;
      }

      snake.unshift(head);
      if (head.x === food.x && head.y === food.y) {
        score += 10;
        scoreEl.textContent = score;
        if (score > high) {
          high = score;
          highEl.textContent = high;
          localStorage.setItem('ignite_snake_high', high);
        }
        playTone(520, 0.1);
        placeFood();
      } else {
        snake.pop();
      }

      draw();
    }

    function draw() {
      ctx.fillStyle = '#020617';
      ctx.fillRect(0, 0, canvas.width, canvas.height);

      // Grid lines faint
      ctx.strokeStyle = '#0f172a';
      ctx.lineWidth = 1;
      for (let i = 0; i <= canvas.width; i += GRID) {
        ctx.beginPath(); ctx.moveTo(i, 0); ctx.lineTo(i, canvas.height); ctx.stroke();
        ctx.beginPath(); ctx.moveTo(0, i); ctx.lineTo(canvas.width, i); ctx.stroke();
      }

      // Food
      ctx.fillStyle = '#ef4444';
      ctx.shadowColor = '#ef4444';
      ctx.shadowBlur = 10;
      ctx.beginPath();
      ctx.arc(food.x * GRID + GRID / 2, food.y * GRID + GRID / 2, GRID / 2 - 2, 0, Math.PI * 2);
      ctx.fill();
      ctx.shadowBlur = 0;

      // Snake
      snake.forEach((seg, i) => {
        ctx.fillStyle = i === 0 ? '#34d399' : '#10b981';
        ctx.shadowColor = i === 0 ? '#34d399' : 'transparent';
        ctx.shadowBlur = i === 0 ? 8 : 0;
        ctx.fillRect(seg.x * GRID + 1, seg.y * GRID + 1, GRID - 2, GRID - 2);
      });
      ctx.shadowBlur = 0;
    }

    function gameOver() {
      isDead = true;
      clearInterval(gameLoop);
      playTone(180, 0.3);
      ovTitle.textContent = 'Game Over';
      overlay.classList.remove('hidden');
    }

    function reset() {
      snake = [{ x: 10, y: 10 }, { x: 9, y: 10 }, { x: 8, y: 10 }];
      dir = { x: 1, y: 0 };
      nextDir = { x: 1, y: 0 };
      score = 0;
      scoreEl.textContent = '0';
      isDead = false;
      isPaused = false;
      placeFood();
      overlay.classList.add('hidden');
      if (gameLoop) clearInterval(gameLoop);
      gameLoop = setInterval(update, 100);
      draw();
    }

    window.addEventListener('keydown', (e) => {
      if (['ArrowUp', 'KeyW'].includes(e.code) && dir.y === 0) { e.preventDefault(); nextDir = { x: 0, y: -1 }; }
      else if (['ArrowDown', 'KeyS'].includes(e.code) && dir.y === 0) { e.preventDefault(); nextDir = { x: 0, y: 1 }; }
      else if (['ArrowLeft', 'KeyA'].includes(e.code) && dir.x === 0) { e.preventDefault(); nextDir = { x: -1, y: 0 }; }
      else if (['ArrowRight', 'KeyD'].includes(e.code) && dir.x === 0) { e.preventDefault(); nextDir = { x: 1, y: 0 }; }
      else if (e.code === 'Space') {
        e.preventDefault();
        if (isDead) { reset(); }
        else {
          isPaused = !isPaused;
          if (isPaused) {
            ovTitle.textContent = 'Paused';
            overlay.classList.remove('hidden');
          } else {
            overlay.classList.add('hidden');
          }
        }
      }
    });

    document.getElementById('btn-u').onclick = () => { if (dir.y === 0) nextDir = { x: 0, y: -1 }; };
    document.getElementById('btn-d').onclick = () => { if (dir.y === 0) nextDir = { x: 0, y: 1 }; };
    document.getElementById('btn-l').onclick = () => { if (dir.x === 0) nextDir = { x: -1, y: 0 }; };
    document.getElementById('btn-r').onclick = () => { if (dir.x === 0) nextDir = { x: 1, y: 0 }; };
    startBtn.onclick = reset;

    reset();
  </script>
</body>
</html>
