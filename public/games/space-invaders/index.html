<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Space Invaders Unblocked</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }
    body {
      background: #020617;
      color: #fff;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 12px;
    }
    .wrapper {
      border: 3px solid #8b5cf6;
      border-radius: 12px;
      overflow: hidden;
      box-shadow: 0 0 25px rgba(139, 92, 246, 0.3);
      position: relative;
    }
    canvas { display: block; background: #050b1a; }
    .hint { margin-top: 10px; font-size: 13px; color: #94a3b8; }
  </style>
</head>
<body>
  <div class="wrapper">
    <canvas id="canvas" width="480" height="420"></canvas>
  </div>
  <div class="hint">Use <b>← / →</b> to Move • <b>Space</b> to Shoot</div>

  <script>
    const canvas = document.getElementById('canvas');
    const ctx = canvas.getContext('2d');

    let playerX = canvas.width / 2 - 15;
    const playerY = canvas.height - 35;
    const playerW = 30;
    const playerH = 14;
    let bullets = [];
    let alienBullets = [];
    let aliens = [];
    let alienDir = 1;
    let alienStepDown = false;
    let alienSpeed = 0.8;
    let score = 0;
    let lives = 3;
    let state = 'PLAY'; // PLAY, WIN, OVER
    let frames = 0;

    function initAliens() {
      aliens = [];
      const rows = 4;
      const cols = 8;
      for (let r = 0; r < rows; r++) {
        for (let c = 0; c < cols; c++) {
          aliens.push({
            x: 50 + c * 44,
            y: 50 + r * 32,
            w: 26,
            h: 18,
            color: r === 0 ? '#ef4444' : (r === 1 ? '#f59e0b' : '#10b981')
          });
        }
      }
    }

    function reset() {
      playerX = canvas.width / 2 - 15;
      bullets = [];
      alienBullets = [];
      score = 0;
      lives = 3;
      state = 'PLAY';
      alienDir = 1;
      alienSpeed = 0.8;
      initAliens();
    }

    let leftPressed = false;
    let rightPressed = false;

    window.addEventListener('keydown', (e) => {
      if (['ArrowLeft', 'KeyA'].includes(e.code)) leftPressed = true;
      if (['ArrowRight', 'KeyD'].includes(e.code)) rightPressed = true;
      if (e.code === 'Space') {
        e.preventDefault();
        if (state !== 'PLAY') {
          reset();
        } else if (bullets.length < 3) {
          bullets.push({ x: playerX + playerW / 2 - 2, y: playerY, w: 4, h: 10 });
        }
      }
    });

    window.addEventListener('keyup', (e) => {
      if (['ArrowLeft', 'KeyA'].includes(e.code)) leftPressed = false;
      if (['ArrowRight', 'KeyD'].includes(e.code)) rightPressed = false;
    });

    canvas.addEventListener('click', () => {
      if (state !== 'PLAY') reset();
    });

    function update() {
      if (state !== 'PLAY') return;
      frames++;

      if (leftPressed && playerX > 10) playerX -= 4;
      if (rightPressed && playerX < canvas.width - playerW - 10) playerX += 4;

      // Player bullets
      for (let i = 0; i < bullets.length; i++) {
        const b = bullets[i];
        b.y -= 7;
        // Hit check
        for (let j = 0; j < aliens.length; j++) {
          const a = aliens[j];
          if (b.x + b.w > a.x && b.x < a.x + a.w && b.y < a.y + a.h && b.y + b.h > a.y) {
            aliens.splice(j, 1);
            bullets.splice(i, 1);
            i--;
            score += 20;
            if (aliens.length === 0) state = 'WIN';
            break;
          }
        }
        if (b && b.y < 0) {
          bullets.splice(i, 1);
          i--;
        }
      }

      // Alien bullets
      if (frames % 45 === 0 && aliens.length > 0) {
        const shooter = aliens[Math.floor(Math.random() * aliens.length)];
        alienBullets.push({ x: shooter.x + shooter.w / 2, y: shooter.y + shooter.h, w: 3, h: 8 });
      }

      for (let i = 0; i < alienBullets.length; i++) {
        const ab = alienBullets[i];
        ab.y += 3.5;
        if (ab.x > playerX && ab.x < playerX + playerW && ab.y > playerY && ab.y < playerY + playerH) {
          alienBullets.splice(i, 1);
          i--;
          lives--;
          if (lives <= 0) state = 'OVER';
        } else if (ab.y > canvas.height) {
          alienBullets.splice(i, 1);
          i--;
        }
      }

      // Move aliens
      let touchEdge = false;
      for (let a of aliens) {
        a.x += alienDir * alienSpeed;
        if (a.x + a.w >= canvas.width - 15 || a.x <= 15) {
          touchEdge = true;
        }
        if (a.y + a.h >= playerY) {
          state = 'OVER';
        }
      }

      if (touchEdge) {
        alienDir *= -1;
        for (let a of aliens) a.y += 12;
        alienSpeed = Math.min(2.5, alienSpeed + 0.1);
      }
    }

    function draw() {
      ctx.fillStyle = '#050b1a';
      ctx.fillRect(0, 0, canvas.width, canvas.height);

      // Stars
      ctx.fillStyle = 'rgba(255, 255, 255, 0.4)';
      for (let i = 0; i < 20; i++) {
        const sx = (i * 37) % canvas.width;
        const sy = (i * 49 + frames * 0.5) % canvas.height;
        ctx.fillRect(sx, sy, 2, 2);
      }

      // Player
      ctx.fillStyle = '#8b5cf6';
      ctx.fillRect(playerX, playerY + 4, playerW, playerH - 4);
      ctx.fillRect(playerX + playerW / 2 - 3, playerY, 6, 6);

      // Bullets
      ctx.fillStyle = '#38bdf8';
      for (let b of bullets) ctx.fillRect(b.x, b.y, b.w, b.h);

      // Alien bullets
      ctx.fillStyle = '#ef4444';
      for (let ab of alienBullets) ctx.fillRect(ab.x, ab.y, ab.w, ab.h);

      // Aliens
      for (let a of aliens) {
        ctx.fillStyle = a.color;
        // Simple pixel alien
        ctx.fillRect(a.x + 4, a.y, a.w - 8, a.h);
        ctx.fillRect(a.x, a.y + 4, a.w, a.h - 8);
        // Eyes
        ctx.fillStyle = '#050b1a';
        ctx.fillRect(a.x + 6, a.y + 4, 3, 3);
        ctx.fillRect(a.x + a.w - 9, a.y + 4, 3, 3);
      }

      // HUD
      ctx.fillStyle = '#94a3b8';
      ctx.font = 'bold 14px monospace';
      ctx.textAlign = 'left';
      ctx.fillText(`SCORE: ${score}`, 16, 24);
      ctx.textAlign = 'right';
      ctx.fillText(`LIVES: ${'▲ '.repeat(lives)}`, canvas.width - 16, 24);

      if (state === 'OVER') {
        ctx.fillStyle = 'rgba(2, 6, 23, 0.8)';
        ctx.fillRect(0, 0, canvas.width, canvas.height);
        ctx.fillStyle = '#ef4444';
        ctx.font = 'bold 28px sans-serif';
        ctx.textAlign = 'center';
        ctx.fillText('INVADERS OVERRUN!', canvas.width / 2, canvas.height / 2 - 10);
        ctx.font = '15px sans-serif';
        ctx.fillStyle = '#fff';
        ctx.fillText('Press SPACE or Click to Restart', canvas.width / 2, canvas.height / 2 + 25);
      } else if (state === 'WIN') {
        ctx.fillStyle = 'rgba(2, 6, 23, 0.8)';
        ctx.fillRect(0, 0, canvas.width, canvas.height);
        ctx.fillStyle = '#10b981';
        ctx.font = 'bold 28px sans-serif';
        ctx.textAlign = 'center';
        ctx.fillText('GALAXY SAVED!', canvas.width / 2, canvas.height / 2 - 10);
        ctx.font = '15px sans-serif';
        ctx.fillStyle = '#fff';
        ctx.fillText('Press SPACE to Play Again', canvas.width / 2, canvas.height / 2 + 25);
      }
    }

    function loop() {
      update();
      draw();
      requestAnimationFrame(loop);
    }

    initAliens();
    loop();
  </script>
</body>
</html>
