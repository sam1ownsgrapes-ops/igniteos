<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Flappy Bird Unblocked</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }
    body {
      background: #0f172a;
      color: #fff;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 12px;
    }
    .wrapper {
      position: relative;
      border: 3px solid #f59e0b;
      border-radius: 12px;
      overflow: hidden;
      box-shadow: 0 0 24px rgba(245, 158, 11, 0.25);
    }
    canvas {
      display: block;
      background: #70c5ce;
      cursor: pointer;
    }
    .hint {
      margin-top: 10px;
      font-size: 13px;
      color: #94a3b8;
    }
  </style>
</head>
<body>
  <div class="wrapper">
    <canvas id="canvas" width="320" height="480"></canvas>
  </div>
  <div class="hint">Press <b>Space</b> or <b>Click/Tap</b> to Flap</div>

  <script>
    const canvas = document.getElementById('canvas');
    const ctx = canvas.getContext('2d');

    let state = 'START'; // START, PLAY, OVER
    let frames = 0;
    let score = 0;
    let high = parseInt(localStorage.getItem('ignite_flappy_high') || '0', 10);

    const bird = {
      x: 60,
      y: 150,
      w: 24,
      h: 20,
      radius: 12,
      velocity: 0,
      gravity: 0.25,
      jump: 4.6,
      rotation: 0,
      flap() {
        this.velocity = -this.jump;
      },
      update() {
        this.velocity += this.gravity;
        this.y += this.velocity;
        if (this.y + this.h / 2 >= canvas.height - 80) {
          this.y = canvas.height - 80 - this.h / 2;
          gameOver();
        }
        if (this.velocity < 0) this.rotation = -0.3;
        else this.rotation = Math.min(Math.PI / 2, this.rotation + 0.05);
      },
      draw() {
        ctx.save();
        ctx.translate(this.x, this.y);
        ctx.rotate(this.rotation);
        // Body
        ctx.fillStyle = '#f59e0b';
        ctx.beginPath();
        ctx.arc(0, 0, this.radius, 0, Math.PI * 2);
        ctx.fill();
        // Eye
        ctx.fillStyle = '#fff';
        ctx.beginPath();
        ctx.arc(4, -4, 4, 0, Math.PI * 2);
        ctx.fill();
        ctx.fillStyle = '#000';
        ctx.beginPath();
        ctx.arc(5, -4, 2, 0, Math.PI * 2);
        ctx.fill();
        // Beak
        ctx.fillStyle = '#ef4444';
        ctx.beginPath();
        ctx.moveTo(8, -1);
        ctx.lineTo(16, 2);
        ctx.lineTo(8, 5);
        ctx.fill();
        // Wing
        ctx.fillStyle = '#fbbf24';
        ctx.beginPath();
        ctx.ellipse(-4, 2, 6, 4, 0, 0, Math.PI * 2);
        ctx.fill();
        ctx.restore();
      }
    };

    const pipes = {
      position: [],
      w: 52,
      gap: 105,
      dx: 2,
      update() {
        if (frames % 100 === 0) {
          const top = Math.floor(Math.random() * (canvas.height - 80 - this.gap - 60)) + 30;
          this.position.push({ x: canvas.width, top });
        }
        for (let i = 0; i < this.position.length; i++) {
          const p = this.position[i];
          p.x -= this.dx;

          // Collision
          const bottomY = p.top + this.gap;
          if (
            bird.x + bird.radius > p.x &&
            bird.x - bird.radius < p.x + this.w
          ) {
            if (bird.y - bird.radius < p.top || bird.y + bird.radius > bottomY) {
              gameOver();
            }
          }

          // Score
          if (p.x + this.w < bird.x && !p.passed) {
            score++;
            p.passed = true;
            if (score > high) {
              high = score;
              localStorage.setItem('ignite_flappy_high', high);
            }
          }

          if (p.x + this.w < 0) {
            this.position.splice(i, 1);
            i--;
          }
        }
      },
      draw() {
        for (let p of this.position) {
          // Top pipe
          ctx.fillStyle = '#22c55e';
          ctx.fillRect(p.x, 0, this.w, p.top);
          ctx.strokeStyle = '#15803d';
          ctx.lineWidth = 2;
          ctx.strokeRect(p.x, 0, this.w, p.top);
          // Top lip
          ctx.fillRect(p.x - 3, p.top - 20, this.w + 6, 20);
          ctx.strokeRect(p.x - 3, p.top - 20, this.w + 6, 20);

          // Bottom pipe
          const bottomY = p.top + this.gap;
          const bottomH = canvas.height - 80 - bottomY;
          ctx.fillRect(p.x, bottomY, this.w, bottomH);
          ctx.strokeRect(p.x, bottomY, this.w, bottomH);
          // Bottom lip
          ctx.fillRect(p.x - 3, bottomY, this.w + 6, 20);
          ctx.strokeRect(p.x - 3, bottomY, this.w + 6, 20);
        }
      }
    };

    function drawGround() {
      ctx.fillStyle = '#ded895';
      ctx.fillRect(0, canvas.height - 80, canvas.width, 80);
      ctx.fillStyle = '#73bf2e';
      ctx.fillRect(0, canvas.height - 80, canvas.width, 14);
      ctx.strokeStyle = '#558022';
      ctx.beginPath();
      ctx.moveTo(0, canvas.height - 66);
      ctx.lineTo(canvas.width, canvas.height - 66);
      ctx.stroke();
    }

    function gameOver() {
      state = 'OVER';
    }

    function reset() {
      bird.y = 150;
      bird.velocity = 0;
      bird.rotation = 0;
      pipes.position = [];
      score = 0;
      frames = 0;
      state = 'START';
    }

    function loop() {
      // Sky
      ctx.fillStyle = '#70c5ce';
      ctx.fillRect(0, 0, canvas.width, canvas.height);

      // Clouds
      ctx.fillStyle = 'rgba(255, 255, 255, 0.7)';
      ctx.beginPath();
      ctx.arc(60, 100, 30, 0, Math.PI * 2);
      ctx.arc(90, 90, 40, 0, Math.PI * 2);
      ctx.arc(130, 100, 30, 0, Math.PI * 2);
      ctx.fill();

      if (state === 'PLAY') {
        pipes.update();
        bird.update();
        frames++;
      }

      pipes.draw();
      drawGround();
      bird.draw();

      // Score display
      if (state === 'PLAY') {
        ctx.fillStyle = '#fff';
        ctx.strokeStyle = '#000';
        ctx.lineWidth = 4;
        ctx.font = 'bold 36px sans-serif';
        ctx.textAlign = 'center';
        ctx.strokeText(score, canvas.width / 2, 60);
        ctx.fillText(score, canvas.width / 2, 60);
      } else if (state === 'START') {
        ctx.fillStyle = '#fff';
        ctx.strokeStyle = '#0f172a';
        ctx.lineWidth = 4;
        ctx.font = 'bold 28px sans-serif';
        ctx.textAlign = 'center';
        ctx.strokeText('FLAPPY BIRD', canvas.width / 2, 140);
        ctx.fillText('FLAPPY BIRD', canvas.width / 2, 140);

        ctx.font = 'bold 16px sans-serif';
        ctx.strokeText('Click or Space to Flap', canvas.width / 2, 220);
        ctx.fillText('Click or Space to Flap', canvas.width / 2, 220);

        ctx.font = '14px sans-serif';
        ctx.fillText(`Best: ${high}`, canvas.width / 2, 260);
      } else if (state === 'OVER') {
        ctx.fillStyle = 'rgba(0,0,0,0.5)';
        ctx.fillRect(0, 0, canvas.width, canvas.height);

        ctx.fillStyle = '#ef4444';
        ctx.font = 'bold 32px sans-serif';
        ctx.textAlign = 'center';
        ctx.fillText('GAME OVER', canvas.width / 2, 160);

        ctx.fillStyle = '#fff';
        ctx.font = '20px sans-serif';
        ctx.fillText(`Score: ${score}`, canvas.width / 2, 210);
        ctx.fillText(`Best: ${high}`, canvas.width / 2, 240);

        ctx.font = 'bold 16px sans-serif';
        ctx.fillStyle = '#f59e0b';
        ctx.fillText('Click to Restart', canvas.width / 2, 300);
      }

      requestAnimationFrame(loop);
    }

    function action() {
      if (state === 'START') {
        state = 'PLAY';
        bird.flap();
      } else if (state === 'PLAY') {
        bird.flap();
      } else if (state === 'OVER') {
        reset();
      }
    }

    window.addEventListener('keydown', (e) => {
      if (e.code === 'Space') {
        e.preventDefault();
        action();
      }
    });

    canvas.addEventListener('click', action);
    canvas.addEventListener('touchstart', (e) => {
      e.preventDefault();
      action();
    });

    loop();
  </script>
</body>
</html>
