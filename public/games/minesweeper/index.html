<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Minesweeper Classic Unblocked</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }
    body {
      background: #0f172a;
      color: #f8fafc;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 12px;
    }
    .wrapper {
      background: #1e293b;
      border: 3px solid #475569;
      border-radius: 12px;
      padding: 16px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 14px;
      box-shadow: 0 4px 25px rgba(0,0,0,0.4);
    }
    .top-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      width: 100%;
      background: #0f172a;
      padding: 8px 14px;
      border-radius: 8px;
      border: 1px solid #334155;
    }
    .counter {
      background: #000;
      color: #ef4444;
      font-family: monospace;
      font-size: 24px;
      font-weight: 800;
      padding: 2px 8px;
      border-radius: 4px;
      letter-spacing: 2px;
      min-width: 60px;
      text-align: center;
    }
    .face-btn {
      font-size: 26px;
      background: #334155;
      border: 1px solid #64748b;
      border-radius: 8px;
      cursor: pointer;
      width: 44px;
      height: 44px;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .face-btn:hover { background: #475569; }
    .grid {
      display: grid;
      gap: 2px;
      background: #334155;
      padding: 4px;
      border-radius: 6px;
    }
    .cell {
      width: 32px;
      height: 32px;
      background: #334155;
      border-radius: 4px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 16px;
      font-weight: 800;
      cursor: pointer;
      transition: background 0.1s;
    }
    .cell:hover:not(.revealed) { background: #475569; }
    .cell.revealed {
      background: #0f172a;
      cursor: default;
    }
    .cell.mine { background: #ef4444 !important; }
    .c-1 { color: #38bdf8; }
    .c-2 { color: #4ade80; }
    .c-3 { color: #f87171; }
    .c-4 { color: #818cf8; }
    .c-5 { color: #fb923c; }
    .hint {
      margin-top: 10px;
      font-size: 13px;
      color: #94a3b8;
    }
  </style>
</head>
<body>
  <div class="wrapper">
    <div class="top-bar">
      <div class="counter" id="mines-count">010</div>
      <button class="face-btn" id="face">🙂</button>
      <div class="counter" id="timer">000</div>
    </div>
    <div class="grid" id="grid"></div>
  </div>
  <div class="hint">Left Click: <b>Reveal</b> • Right Click (or Long Press): <b>Flag 🚩</b></div>

  <script>
    const ROWS = 9;
    const COLS = 9;
    const MINES = 10;

    let board = [];
    let revealedCount = 0;
    let flagsCount = 0;
    let gameOver = false;
    let timer = 0;
    let timerInterval = null;

    const gridEl = document.getElementById('grid');
    const faceEl = document.getElementById('face');
    const minesEl = document.getElementById('mines-count');
    const timerEl = document.getElementById('timer');

    gridEl.style.gridTemplateColumns = `repeat(${COLS}, 32px)`;

    function init() {
      board = [];
      revealedCount = 0;
      flagsCount = 0;
      gameOver = false;
      timer = 0;
      faceEl.textContent = '🙂';
      clearInterval(timerInterval);
      timerInterval = null;
      timerEl.textContent = '000';
      minesEl.textContent = String(MINES).padStart(3, '0');

      for (let r = 0; r < ROWS; r++) {
        board[r] = [];
        for (let c = 0; c < COLS; c++) {
          board[r][c] = {
            r, c,
            mine: false,
            revealed: false,
            flagged: false,
            count: 0
          };
        }
      }

      // Place mines
      let placed = 0;
      while (placed < MINES) {
        const r = Math.floor(Math.random() * ROWS);
        const c = Math.floor(Math.random() * COLS);
        if (!board[r][c].mine) {
          board[r][c].mine = true;
          placed++;
        }
      }

      // Count neighbors
      for (let r = 0; r < ROWS; r++) {
        for (let c = 0; c < COLS; c++) {
          if (!board[r][c].mine) {
            let count = 0;
            for (let dr = -1; dr <= 1; dr++) {
              for (let dc = -1; dc <= 1; dc++) {
                const nr = r + dr, nc = c + dc;
                if (nr >= 0 && nr < ROWS && nc >= 0 && nc < COLS && board[nr][nc].mine) {
                  count++;
                }
              }
            }
            board[r][c].count = count;
          }
        }
      }

      render();
    }

    function render() {
      gridEl.innerHTML = '';
      for (let r = 0; r < ROWS; r++) {
        for (let c = 0; c < COLS; c++) {
          const cell = board[r][c];
          const div = document.createElement('div');
          div.className = 'cell';
          if (cell.revealed) {
            div.classList.add('revealed');
            if (cell.mine) {
              div.classList.add('mine');
              div.textContent = '💣';
            } else if (cell.count > 0) {
              div.classList.add('c-' + cell.count);
              div.textContent = cell.count;
            }
          } else if (cell.flagged) {
            div.textContent = '🚩';
          }

          div.addEventListener('click', () => reveal(r, c));
          div.addEventListener('contextmenu', (e) => {
            e.preventDefault();
            toggleFlag(r, c);
          });

          gridEl.appendChild(div);
        }
      }
    }

    function startTimer() {
      if (!timerInterval) {
        timerInterval = setInterval(() => {
          timer++;
          timerEl.textContent = String(Math.min(999, timer)).padStart(3, '0');
        }, 1000);
      }
    }

    function reveal(r, c) {
      if (gameOver) return;
      const cell = board[r][c];
      if (cell.revealed || cell.flagged) return;

      startTimer();
      cell.revealed = true;
      revealedCount++;

      if (cell.mine) {
        gameOver = true;
        clearInterval(timerInterval);
        faceEl.textContent = '😵';
        // Reveal all mines
        for (let row of board) {
          for (let item of row) {
            if (item.mine) item.revealed = true;
          }
        }
        render();
        return;
      }

      if (cell.count === 0) {
        // Flood fill empty cells
        for (let dr = -1; dr <= 1; dr++) {
          for (let dc = -1; dc <= 1; dc++) {
            const nr = r + dr, nc = c + dc;
            if (nr >= 0 && nr < ROWS && nc >= 0 && nc < COLS) {
              reveal(nr, nc);
            }
          }
        }
      }

      // Check win
      if (revealedCount === ROWS * COLS - MINES) {
        gameOver = true;
        clearInterval(timerInterval);
        faceEl.textContent = '😎';
      }

      render();
    }

    function toggleFlag(r, c) {
      if (gameOver) return;
      const cell = board[r][c];
      if (cell.revealed) return;

      cell.flagged = !cell.flagged;
      flagsCount += cell.flagged ? 1 : -1;
      minesEl.textContent = String(Math.max(0, MINES - flagsCount)).padStart(3, '0');
      render();
    }

    faceEl.addEventListener('click', init);
    init();
  </script>
</body>
</html>
