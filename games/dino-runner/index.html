<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dino Runner Unblocked</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }
    body {
      background: #0f172a;
      color: #f8fafc;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 12px;
    }
    .game-wrap {
      border: 2px solid #334155;
      background: #f8fafc;
      border-radius: 12px;
      overflow: hidden;
      box-shadow: 0 4px 20px rgba(0,0,0,0.5);
    }
    canvas {
      display: block;
      background: #f8fafc;
    }
    .hint {
      margin-top: 12px;
      font-size: 13px;
      color: #94a3b8;
    }
  </style>
</head>
<body>
  <div class="game-wrap">
    <canvas id="dino" width="600" height="200"></canvas>
  </div>
  <div class="hint">Press <b>Space</b> or <b>↑</b> to Jump • <b>↓</b> to Duck</div>

  <script>
    const canvas = document.getElementById('dino');
    const ctx = canvas.getContext('2d');

    let score = 0;
    let high = parseInt(localStorage.getItem('ignite_dino_high') || '0', 10);
    let speed = 6;
    let gameOver = false;
    let gameStarted = false;
    let frames = 0;

    const dino = {
      x: 50,
      y: 130,
      w: 40,
      h: 44,
      vy: 0,
      jumpForce: 11,
      gravity: 0.6,
      ground: 130,
      isGrounded: true,
      ducking: false,
      update() {
        if (!this.isGrounded) {
          this.vy += this.gravity;
          this.y += this.vy;
          if (this.y >= this.ground) {
            this.y = this.ground;
            this.vy = 0;
            this.isGrounded = true;
          }
        }
      },
      jump() {
        if (this.isGrounded) {
          this.vy = -this.jumpForce;
          this.isGrounded = false;
        }
      },
      draw() {
        ctx.fillStyle = '#334155';
        if (this.ducking && this.isGrounded) {
          ctx.fillRect(this.x, this.y + 16, 50, 28);
          // Head
          ctx.fillRect(this.x + 40, this.y + 16, 14, 12);
          // Eye
          ctx.fillStyle = '#fff';
          ctx.fillRect(this.x + 48, this.y + 18, 3, 3);
        } else {
          // Body
          ctx.fillRect(this.x + 10, this.y, 24, 30);
          // Head
          ctx.fillRect(this.x + 20, this.y - 8, 20, 16);
          // Eye
          ctx.fillStyle = '#fff';
          ctx.fillRect(this.x + 32, this.y - 6, 3, 3);
          ctx.fillStyle = '#334155';
          // Legs
          if (this.isGrounded) {
            const step = Math.floor(frames / 6) % 2;
            if (step === 0) {
              ctx.fillRect(this.x + 12, this.y + 30, 4, 14);
              ctx.fillRect(this.x + 26, this.y + 30, 4, 8);
            } else {
              ctx.fillRect(this.x + 12, this.y + 30, 4, 8);
              ctx.fillRect(this.x + 26, this.y + 30, 4, 14);
            }
          } else {
            ctx.fillRect(this.x + 12, this.y + 30, 4, 10);
            ctx.fillRect(this.x + 26, this.y + 30, 4, 10);
          }
        }
      }
    };

    let obstacles = [];

    function spawnObstacle() {
      const type = Math.random() < 0.7 ? 'cactus' : 'bird';
      if (type === 'cactus') {
        const height = Math.random() < 0.5 ? 36 : 48;
        obstacles.push({
          type: 'cactus',
          x: canvas.width + 20,
          y: 174 - height,
          w: 20,
          h: height
        });
      } else {
        const heights = [90, 120, 145];
        const y = heights[Math.floor(Math.random() * heights.length)];
        obstacles.push({
          type: 'bird',
          x: canvas.width + 20,
          y: y,
          w: 30,
          h: 20
        });
      }
    }

    function reset() {
      score = 0;
      speed = 6;
      gameOver = false;
      gameStarted = true;
      obstacles = [];
      dino.y = dino.ground;
      dino.vy = 0;
      dino.isGrounded = true;
      frames = 0;
    }

    function update() {
      if (!gameStarted) {
        draw();
        requestAnimationFrame(update);
        return;
      }
      if (gameOver) {
        draw();
        requestAnimationFrame(update);
        return;
      }

      frames++;
      score++;
      if (score % 250 === 0) speed += 0.4;

      dino.update();

      if (frames % Math.max(50, Math.floor(100 - speed * 3)) === 0 && Math.random() > 0.3) {
        if (obstacles.length === 0 || canvas.width - obstacles[obstacles.length - 1].x > 200) {
          spawnObstacle();
        }
      }

      for (let i = 0; i < obstacles.length; i++) {
        const ob = obstacles[i];
        ob.x -= speed;

        // Collision box
        const dw = (dino.ducking && dino.isGrounded) ? 50 : 34;
        const dh = (dino.ducking && dino.isGrounded) ? 28 : 44;
        const dy = (dino.ducking && dino.isGrounded) ? dino.y + 16 : dino.y - 8;

        if (
          dino.x + dw > ob.x + 4 &&
          dino.x + 8 < ob.x + ob.w &&
          dy + dh > ob.y &&
          dy < ob.y + ob.h
        ) {
          gameOver = true;
          if (score > high) {
            high = score;
            localStorage.setItem('ignite_dino_high', high);
          }
        }

        if (ob.x + ob.w < 0) {
          obstacles.splice(i, 1);
          i--;
        }
      }

      draw();
      requestAnimationFrame(update);
    }

    function draw() {
      ctx.fillStyle = '#f8fafc';
      ctx.fillRect(0, 0, canvas.width, canvas.height);

      // Ground line
      ctx.strokeStyle = '#64748b';
      ctx.lineWidth = 2;
      ctx.beginPath();
      ctx.moveTo(0, 174);
      ctx.lineTo(canvas.width, 174);
      ctx.stroke();

      // Ground bumps
      ctx.fillStyle = '#94a3b8';
      for (let i = 0; i < canvas.width; i += 40) {
        const bumpX = (i - (frames * speed) % 40);
        ctx.fillRect(bumpX, 177, 6, 2);
      }

      // Obstacles
      obstacles.forEach(ob => {
        if (ob.type === 'cactus') {
          ctx.fillStyle = '#15803d';
          ctx.fillRect(ob.x, ob.y, ob.w, ob.h);
          ctx.fillRect(ob.x - 4, ob.y + 10, 6, 12);
          ctx.fillRect(ob.x + ob.w - 2, ob.y + 6, 6, 12);
        } else {
          ctx.fillStyle = '#0f172a';
          ctx.fillRect(ob.x, ob.y, ob.w, ob.h);
          // Flapping wing
          const wingUp = Math.floor(frames / 8) % 2 === 0;
          ctx.fillRect(ob.x + 10, wingUp ? ob.y - 8 : ob.y + 14, 10, 8);
        }
      });

      dino.draw();

      // Score
      ctx.fillStyle = '#334155';
      ctx.font = 'bold 15px monospace';
      ctx.textAlign = 'right';
      ctx.fillText(`HI ${String(high).padStart(5, '0')}  ${String(score).padStart(5, '0')}`, canvas.width - 20, 30);

      if (!gameStarted) {
        ctx.fillStyle = '#0f172a';
        ctx.font = 'bold 20px sans-serif';
        ctx.textAlign = 'center';
        ctx.fillText('Press SPACE to Jump & Start', canvas.width / 2, 100);
      } else if (gameOver) {
        ctx.fillStyle = '#ef4444';
        ctx.font = 'bold 22px sans-serif';
        ctx.textAlign = 'center';
        ctx.fillText('G A M E   O V E R', canvas.width / 2, 85);
        ctx.font = '14px sans-serif';
        ctx.fillStyle = '#475569';
        ctx.fillText('Press SPACE to play again', canvas.width / 2, 115);
      }
    }

    window.addEventListener('keydown', (e) => {
      if (e.code === 'Space' || e.code === 'ArrowUp') {
        e.preventDefault();
        if (!gameStarted || gameOver) reset();
        else dino.jump();
      } else if (e.code === 'ArrowDown') {
        e.preventDefault();
        dino.ducking = true;
      }
    });

    window.addEventListener('keyup', (e) => {
      if (e.code === 'ArrowDown') {
        dino.ducking = false;
      }
    });

    canvas.addEventListener('click', () => {
      if (!gameStarted || gameOver) reset();
      else dino.jump();
    });

    update();
  </script>
</body>
</html>
