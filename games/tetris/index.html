<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tetris Classic Unblocked</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: #0f172a;
      color: #f8fafc;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 10px;
    }
    .wrapper {
      display: flex;
      gap: 16px;
      align-items: flex-start;
    }
    .main-board {
      position: relative;
      border: 3px solid #6366f1;
      border-radius: 8px;
      background: #020617;
      box-shadow: 0 0 25px rgba(99, 102, 241, 0.25);
    }
    canvas { display: block; }
    .side-panel {
      display: flex;
      flex-direction: column;
      gap: 12px;
      width: 130px;
    }
    .card {
      background: #1e293b;
      border: 1px solid #334155;
      padding: 10px;
      border-radius: 8px;
      text-align: center;
    }
    .card-title {
      font-size: 11px;
      text-transform: uppercase;
      color: #94a3b8;
      font-weight: bold;
      margin-bottom: 4px;
    }
    .card-val {
      font-size: 18px;
      font-weight: 800;
      color: #6366f1;
    }
    .btn {
      background: #6366f1;
      color: #fff;
      border: none;
      padding: 8px 12px;
      font-size: 13px;
      font-weight: bold;
      border-radius: 6px;
      cursor: pointer;
      transition: background 0.15s;
    }
    .btn:hover { background: #4f46e5; }
    .overlay {
      position: absolute;
      top: 0; left: 0; right: 0; bottom: 0;
      background: rgba(2, 6, 23, 0.9);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 12px;
      border-radius: 6px;
    }
    .overlay.hidden { display: none; }
    .overlay h2 { font-size: 24px; color: #f43f5e; }
    .controls-hint {
      margin-top: 10px;
      font-size: 12px;
      color: #64748b;
      text-align: center;
    }
  </style>
</head>
<body>
  <div class="wrapper">
    <div class="main-board">
      <canvas id="tetris" width="240" height="480"></canvas>
      <div class="overlay hidden" id="overlay">
        <h2 id="ov-msg">Game Over</h2>
        <button class="btn" id="restart-btn">Play Again</button>
      </div>
    </div>
    <div class="side-panel">
      <div class="card">
        <div class="card-title">Score</div>
        <div class="card-val" id="score">0</div>
      </div>
      <div class="card">
        <div class="card-title">Lines</div>
        <div class="card-val" id="lines">0</div>
      </div>
      <div class="card">
        <div class="card-title">Level</div>
        <div class="card-val" id="level">1</div>
      </div>
      <div class="card">
        <div class="card-title">Next</div>
        <canvas id="next-piece" width="100" height="80" style="margin: 0 auto;"></canvas>
      </div>
      <button class="btn" id="pause-btn">Pause</button>
    </div>
  </div>
  <div class="controls-hint">
    <b>← / →</b>: Move • <b>↑</b>: Rotate • <b>↓</b>: Soft Drop • <b>Space</b>: Hard Drop
  </div>

  <script>
    const canvas = document.getElementById('tetris');
    const ctx = canvas.getContext('2d');
    const nextCanvas = document.getElementById('next-piece');
    const nextCtx = nextCanvas.getContext('2d');

    const COLS = 10;
    const ROWS = 20;
    const BLOCK = 24;

    const COLORS = [
      null,
      '#06b6d4', // I cyan
      '#3b82f6', // J blue
      '#f97316', // L orange
      '#eab308', // O yellow
      '#22c55e', // S green
      '#a855f7', // T purple
      '#ef4444'  // Z red
    ];

    const PIECES = [
      [],
      [[1,1,1,1]], // I
      [[2,0,0],[2,2,2]], // J
      [[0,0,3],[3,3,3]], // L
      [[4,4],[4,4]], // O
      [[0,5,5],[5,5,0]], // S
      [[0,6,0],[6,6,6]], // T
      [[7,7,0],[0,7,7]]  // Z
    ];

    let grid = Array.from({ length: ROWS }, () => Array(COLS).fill(0));
    let score = 0;
    let lines = 0;
    let level = 1;
    let gameOver = false;
    let paused = false;

    let current = null;
    let next = null;
    let dropCounter = 0;
    let lastTime = 0;

    function randomPiece() {
      const type = Math.floor(Math.random() * 7) + 1;
      return {
        shape: PIECES[type],
        color: type,
        x: Math.floor(COLS / 2) - Math.ceil(PIECES[type][0].length / 2),
        y: 0
      };
    }

    function collide(arena, piece) {
      const m = piece.shape;
      const o = { x: piece.x, y: piece.y };
      for (let y = 0; y < m.length; ++y) {
        for (let x = 0; x < m[y].length; ++x) {
          if (m[y][x] !== 0 &&
             (arena[y + o.y] && arena[y + o.y][x + o.x]) !== 0) {
            return true;
          }
        }
      }
      return false;
    }

    function merge(arena, piece) {
      piece.shape.forEach((row, y) => {
        row.forEach((val, x) => {
          if (val !== 0) {
            arena[y + piece.y][x + piece.x] = piece.color;
          }
        });
      });
    }

    function rotate(matrix, dir) {
      for (let y = 0; y < matrix.length; ++y) {
        for (let x = 0; x < y; ++x) {
          [matrix[x][y], matrix[y][x]] = [matrix[y][x], matrix[x][y]];
        }
      }
      if (dir > 0) matrix.forEach(row => row.reverse());
      else matrix.reverse();
    }

    function playerRotate(dir) {
      const pos = current.x;
      let offset = 1;
      rotate(current.shape, dir);
      while (collide(grid, current)) {
        current.x += offset;
        offset = -(offset + (offset > 0 ? 1 : -1));
        if (offset > current.shape[0].length) {
          rotate(current.shape, -dir);
          current.x = pos;
          return;
        }
      }
    }

    function sweep() {
      let rowCount = 0;
      outer: for (let y = ROWS - 1; y >= 0; --y) {
        for (let x = 0; x < COLS; ++x) {
          if (grid[y][x] === 0) continue outer;
        }
        const row = grid.splice(y, 1)[0].fill(0);
        grid.unshift(row);
        ++y;
        rowCount++;
      }
      if (rowCount > 0) {
        lines += rowCount;
        score += [0, 40, 100, 300, 1200][rowCount] * level;
        level = Math.floor(lines / 10) + 1;
        document.getElementById('score').textContent = score;
        document.getElementById('lines').textContent = lines;
        document.getElementById('level').textContent = level;
      }
    }

    function playerDrop() {
      current.y++;
      if (collide(grid, current)) {
        current.y--;
        merge(grid, current);
        playerReset();
        sweep();
      }
      dropCounter = 0;
    }

    function hardDrop() {
      while (!collide(grid, current)) {
        current.y++;
        score += 2;
      }
      current.y--;
      merge(grid, current);
      playerReset();
      sweep();
      document.getElementById('score').textContent = score;
    }

    function playerReset() {
      current = next || randomPiece();
      next = randomPiece();
      current.x = Math.floor(COLS / 2) - Math.ceil(current.shape[0].length / 2);
      current.y = 0;
      drawNext();
      if (collide(grid, current)) {
        gameOver = true;
        document.getElementById('overlay').classList.remove('hidden');
      }
    }

    function drawNext() {
      nextCtx.fillStyle = '#1e293b';
      nextCtx.fillRect(0, 0, nextCanvas.width, nextCanvas.height);
      const m = next.shape;
      const bSize = 16;
      const offX = (nextCanvas.width - m[0].length * bSize) / 2;
      const offY = (nextCanvas.height - m.length * bSize) / 2;
      m.forEach((row, y) => {
        row.forEach((val, x) => {
          if (val !== 0) {
            nextCtx.fillStyle = COLORS[next.color];
            nextCtx.fillRect(offX + x * bSize, offY + y * bSize, bSize - 1, bSize - 1);
          }
        });
      });
    }

    function draw() {
      ctx.fillStyle = '#020617';
      ctx.fillRect(0, 0, canvas.width, canvas.height);

      // Grid
      grid.forEach((row, y) => {
        row.forEach((val, x) => {
          if (val !== 0) {
            ctx.fillStyle = COLORS[val];
            ctx.fillRect(x * BLOCK, y * BLOCK, BLOCK - 1, BLOCK - 1);
          }
        });
      });

      // Current piece
      if (current) {
        // Draw ghost piece
        let ghostY = current.y;
        while (!collide(grid, { ...current, y: ghostY + 1 })) {
          ghostY++;
        }
        current.shape.forEach((row, y) => {
          row.forEach((val, x) => {
            if (val !== 0) {
              ctx.strokeStyle = 'rgba(255, 255, 255, 0.2)';
              ctx.strokeRect((current.x + x) * BLOCK, (ghostY + y) * BLOCK, BLOCK - 1, BLOCK - 1);
              ctx.fillStyle = COLORS[current.color];
              ctx.fillRect((current.x + x) * BLOCK, (current.y + y) * BLOCK, BLOCK - 1, BLOCK - 1);
            }
          });
        });
      }
    }

    function update(time = 0) {
      if (!paused && !gameOver) {
        const deltaTime = time - lastTime;
        lastTime = time;
        dropCounter += deltaTime;
        const dropInterval = Math.max(100, 1000 - (level - 1) * 100);
        if (dropCounter > dropInterval) {
          playerDrop();
        }
        draw();
      }
      requestAnimationFrame(update);
    }

    function reset() {
      grid = Array.from({ length: ROWS }, () => Array(COLS).fill(0));
      score = 0;
      lines = 0;
      level = 1;
      gameOver = false;
      paused = false;
      document.getElementById('score').textContent = '0';
      document.getElementById('lines').textContent = '0';
      document.getElementById('level').textContent = '1';
      document.getElementById('overlay').classList.add('hidden');
      playerReset();
    }

    window.addEventListener('keydown', (e) => {
      if (gameOver) return;
      if (e.code === 'ArrowLeft' || e.code === 'KeyA') {
        current.x--;
        if (collide(grid, current)) current.x++;
      } else if (e.code === 'ArrowRight' || e.code === 'KeyD') {
        current.x++;
        if (collide(grid, current)) current.x--;
      } else if (e.code === 'ArrowDown' || e.code === 'KeyS') {
        playerDrop();
      } else if (e.code === 'ArrowUp' || e.code === 'KeyW') {
        playerRotate(1);
      } else if (e.code === 'Space') {
        e.preventDefault();
        hardDrop();
      }
    });

    document.getElementById('restart-btn').onclick = reset;
    document.getElementById('pause-btn').onclick = () => {
      paused = !paused;
      document.getElementById('pause-btn').textContent = paused ? 'Resume' : 'Pause';
    };

    reset();
    update();
  </script>
</body>
</html>
