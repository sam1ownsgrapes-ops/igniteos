<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pong Classic Unblocked</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }
    body {
      background: #020617;
      color: #fff;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 12px;
    }
    .wrapper {
      border: 3px solid #38bdf8;
      border-radius: 12px;
      overflow: hidden;
      box-shadow: 0 0 25px rgba(56, 189, 248, 0.25);
    }
    canvas { display: block; background: #090d16; }
    .hint { margin-top: 10px; font-size: 13px; color: #94a3b8; }
  </style>
</head>
<body>
  <div class="wrapper">
    <canvas id="pong" width="540" height="360"></canvas>
  </div>
  <div class="hint">Use <b>W / S</b> or <b>Mouse</b> for Left Paddle • AI controls Right Paddle</div>

  <script>
    const canvas = document.getElementById('pong');
    const ctx = canvas.getContext('2d');

    const PADDLE_H = 70;
    const PADDLE_W = 10;
    let p1Y = (canvas.height - PADDLE_H) / 2;
    let p2Y = (canvas.height - PADDLE_H) / 2;

    let ballX = canvas.width / 2;
    let ballY = canvas.height / 2;
    let ballDX = 4.5;
    let ballDY = 3;
    const BALL_SIZE = 8;

    let p1Score = 0;
    let p2Score = 0;
    let wPressed = false;
    let sPressed = false;

    function resetBall(servingToRight) {
      ballX = canvas.width / 2;
      ballY = canvas.height / 2;
      ballDX = servingToRight ? 4.5 : -4.5;
      ballDY = (Math.random() * 4 - 2);
    }

    window.addEventListener('keydown', (e) => {
      if (e.code === 'KeyW' || e.code === 'ArrowUp') wPressed = true;
      if (e.code === 'KeyS' || e.code === 'ArrowDown') sPressed = true;
    });

    window.addEventListener('keyup', (e) => {
      if (e.code === 'KeyW' || e.code === 'ArrowUp') wPressed = false;
      if (e.code === 'KeyS' || e.code === 'ArrowDown') sPressed = false;
    });

    canvas.addEventListener('mousemove', (e) => {
      const rect = canvas.getBoundingClientRect();
      p1Y = Math.max(0, Math.min(canvas.height - PADDLE_H, e.clientY - rect.top - PADDLE_H / 2));
    });

    function update() {
      if (wPressed && p1Y > 0) p1Y -= 6;
      if (sPressed && p1Y < canvas.height - PADDLE_H) p1Y += 6;

      // Simple AI
      const p2Center = p2Y + PADDLE_H / 2;
      if (p2Center < ballY - 15 && p2Y < canvas.height - PADDLE_H) p2Y += 4.2;
      else if (p2Center > ballY + 15 && p2Y > 0) p2Y -= 4.2;

      // Ball movement
      ballX += ballDX;
      ballY += ballDY;

      // Top / Bottom wall bounce
      if (ballY < BALL_SIZE || ballY > canvas.height - BALL_SIZE) {
        ballDY = -ballDY;
      }

      // Left Paddle collision
      if (ballX - BALL_SIZE < 25 && ballX + BALL_SIZE > 15) {
        if (ballY > p1Y && ballY < p1Y + PADDLE_H) {
          const hit = (ballY - (p1Y + PADDLE_H / 2)) / (PADDLE_H / 2);
          ballDX = Math.abs(ballDX) * 1.05;
          ballDY = hit * 5;
        }
      }

      // Right Paddle collision
      if (ballX + BALL_SIZE > canvas.width - 25 && ballX - BALL_SIZE < canvas.width - 15) {
        if (ballY > p2Y && ballY < p2Y + PADDLE_H) {
          const hit = (ballY - (p2Y + PADDLE_H / 2)) / (PADDLE_H / 2);
          ballDX = -Math.abs(ballDX) * 1.05;
          ballDY = hit * 5;
        }
      }

      // Scoring
      if (ballX < 0) {
        p2Score++;
        resetBall(true);
      } else if (ballX > canvas.width) {
        p1Score++;
        resetBall(false);
      }
    }

    function draw() {
      ctx.fillStyle = '#090d16';
      ctx.fillRect(0, 0, canvas.width, canvas.height);

      // Center dotted line
      ctx.strokeStyle = '#1e293b';
      ctx.lineWidth = 4;
      ctx.setLineDash([10, 10]);
      ctx.beginPath();
      ctx.moveTo(canvas.width / 2, 0);
      ctx.lineTo(canvas.width / 2, canvas.height);
      ctx.stroke();
      ctx.setLineDash([]);

      // Paddles
      ctx.fillStyle = '#38bdf8';
      ctx.fillRect(15, p1Y, PADDLE_W, PADDLE_H);

      ctx.fillStyle = '#ef4444';
      ctx.fillRect(canvas.width - 25, p2Y, PADDLE_W, PADDLE_H);

      // Ball
      ctx.fillStyle = '#fff';
      ctx.beginPath();
      ctx.arc(ballX, ballY, BALL_SIZE, 0, Math.PI * 2);
      ctx.fill();

      // Scores
      ctx.font = 'bold 36px monospace';
      ctx.fillStyle = '#38bdf8';
      ctx.fillText(p1Score, canvas.width / 2 - 60, 50);
      ctx.fillStyle = '#ef4444';
      ctx.fillText(p2Score, canvas.width / 2 + 35, 50);
    }

    function loop() {
      update();
      draw();
      requestAnimationFrame(loop);
    }

    loop();
  </script>
</body>
</html>
